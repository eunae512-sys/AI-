                <span class="inline-flex items-center gap-1.5 text-[11px] text-gray-700"><span class="h-1.5 w-1.5 rounded-full ${ch.dot}"></span>${escapeHtml(ch.label)}</span>
                <span class="inline-flex items-center text-[10px] px-1.5 py-0.5 rounded ${tb.cls}">${escapeHtml(tb.label)}</span>
                ${item.priority === 'high' ? '<span class="text-[10px] text-rose-700 font-medium">우선</span>' : ''}
              </div>
              <div class="mt-1 text-sm font-medium tracking-tight">${escapeHtml(item.title)}</div>
              <div class="mt-1 text-xs text-gray-500 leading-relaxed truncate">${escapeHtml(item.excerpt)}</div>
              <div class="mt-2 flex items-center gap-2 flex-wrap">
                <span class="text-[11px] ${reasonCls} font-medium">${escapeHtml(item.reason)}</span>
                ${item.flags.map(f => `<span class="text-[10px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-600 border border-gray-200">${escapeHtml(f)}</span>`).join('')}
              </div>
            </div>
            <div class="hidden md:flex items-center gap-1.5 shrink-0">
              <div class="h-6 w-6 rounded-full ${item.assignee.avatarBg} ${item.assignee.avatarFg} grid place-items-center text-[10px] font-semibold" title="${escapeHtml(item.assignee.name)}">${escapeHtml(item.assignee.initial)}</div>
              <span class="text-[11px] text-gray-500">${escapeHtml(item.assignee.name)}</span>
            </div>
            <div class="text-[11px] text-gray-400 tabular-nums shrink-0 w-16 text-right">${ageText(item.ageHours)}</div>
            <div class="flex items-center gap-1 shrink-0">
              <a href="05-content-result.html?id=${encodeURIComponent(item.brandId)}&c=${encodeURIComponent(item.title)}" class="text-[10px] px-2 py-1 rounded border border-gray-200 hover:bg-white text-gray-700">보기</a>
              <button class="text-[10px] px-2 py-1 rounded border border-gray-200 hover:bg-rose-50 hover:border-rose-200 hover:text-rose-700 text-gray-700" data-action="reject" data-id="${item.id}">반려</button>
              <button class="text-[10px] px-2 py-1 rounded bg-gray-900 text-white hover:bg-black" data-action="approve" data-id="${item.id}">승인</button>
            </div>
          </div>
        </div>`;
    }

    let CURRENT_FILTER = 'all';
    let SELECTED = new Set();

    function applyFilter() {
      const list = document.getElementById('queue-list');
      const empty = document.getElementById('empty-state');
      const filtered = QUEUE.filter(it => {
        if (CURRENT_FILTER === 'all') return true;
        return it.type === CURRENT_FILTER;
      });
      list.innerHTML = filtered.map(renderRow).join('');
      empty.classList.toggle('hidden', filtered.length > 0);
      updateBulkBtn();
    }

    function updateBulkBtn() {
      const btn = document.getElementById('bulk-approve-btn');
      const cnt = document.getElementById('bulk-count');
      btn.disabled = SELECTED.size === 0;
      cnt.textContent = SELECTED.size;
    }

    function updateCounts() {
      const remaining = QUEUE.length;
      document.getElementById('queue-count-badge').textContent = remaining;
      document.getElementById('kpi-total').textContent = remaining;
      document.getElementById('kpi-medical').textContent = QUEUE.filter(q => q.type === 'medical').length;
      document.getElementById('kpi-tone').textContent = QUEUE.filter(q => q.type === 'tone').length;
      document.getElementById('kpi-claim').textContent = QUEUE.filter(q => q.type === 'claim').length;
      // 필터 chip 카운트도 업데이트
      const counts = {
        all: QUEUE.length,
        medical: QUEUE.filter(q => q.type === 'medical').length,
        tone: QUEUE.filter(q => q.type === 'tone').length,
        claim: QUEUE.filter(q => q.type === 'claim').length,
        general: QUEUE.filter(q => q.type === 'general').length,
      };
      document.querySelectorAll('[data-filter]').forEach(b => {
        const cnt = b.querySelector('span');
        if (cnt) cnt.textContent = counts[b.dataset.filter] ?? 0;
      });
    }

    function removeItem(id, action) {
      const idx = QUEUE.findIndex(q => q.id === id);
      if (idx < 0) return;
      const item = QUEUE[idx];
      // 행 페이드 아웃 → 데이터 제거 → 재렌더
      const row = document.querySelector(`.queue-row[data-id="${id}"]`);
      if (row) row.classList.add('row-fade');
      setTimeout(() => {
        QUEUE.splice(idx, 1);
        SELECTED.delete(id);
        applyFilter();
        updateCounts();
        const verb = action === 'approve' ? '승인' : '반려';
        const tone = action === 'approve' ? 'success' : 'info';
        window.mockupToast && window.mockupToast(`${item.brandName} · ${verb} 처리됨 (${item.title.slice(0, 24)}…)`, tone);
        if (QUEUE.length === 0) {
          document.getElementById('empty-state')?.classList.remove('hidden');
        }
      }, 350);
    }

    document.addEventListener('DOMContentLoaded', () => {
      applyFilter();
      updateCounts();

      // 필터 chip
      document.getElementById('status-filter')?.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-filter]');
        if (!btn) return;
        document.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('filter-chip-active'));
        btn.classList.add('filter-chip-active');
        CURRENT_FILTER = btn.dataset.filter;
        applyFilter();
      });

      document.getElementById('reset-filter-btn')?.addEventListener('click', () => {
        document.querySelector('[data-filter="all"]')?.click();
      });

      // 행 액션
      document.getElementById('queue-list')?.addEventListener('click', (e) => {
        const checkBox = e.target.closest('.row-check');
        if (checkBox) {
          if (checkBox.checked) SELECTED.add(checkBox.dataset.id);
          else SELECTED.delete(checkBox.dataset.id);
          updateBulkBtn();
          return;
        }
        const approve = e.target.closest('[data-action="approve"]');
        if (approve) { e.preventDefault(); removeItem(approve.dataset.id, 'approve'); return; }
        const reject = e.target.closest('[data-action="reject"]');
        if (reject) { e.preventDefault(); removeItem(reject.dataset.id, 'reject'); return; }
      });

      // 전체 선택
      document.getElementById('select-all')?.addEventListener('change', (e) => {
        const checked = e.target.checked;
        document.querySelectorAll('.row-check').forEach(cb => {
          cb.checked = checked;
          if (checked) SELECTED.add(cb.dataset.id);
          else SELECTED.delete(cb.dataset.id);
        });
        updateBulkBtn();
      });

      // 일괄 승인
      document.getElementById('bulk-approve-btn')?.addEventListener('click', () => {
        if (SELECTED.size === 0) return;
        const count = SELECTED.size;
        const ids = [...SELECTED];
        window.mockupToast && window.mockupToast(`${count}건 승인 진행 중…`, 'info');
        ids.forEach((id, i) => setTimeout(() => removeItem(id, 'approve'), i * 240));
      });

      // 검색
      document.getElementById('search-input')?.addEventListener('input', (e) => {
        const q = e.target.value.trim().toLowerCase();
        document.querySelectorAll('.queue-row').forEach(row => {
          const id = row.dataset.id;
          const item = QUEUE.find(x => x.id === id);
          if (!item) return;
          const hay = (item.brandName + ' ' + item.title + ' ' + item.excerpt + ' ' + item.reason).toLowerCase();
          row.style.display = (!q || hay.includes(q)) ? '' : 'none';
        });
      });
    });
  </script>
</body>
</html>
